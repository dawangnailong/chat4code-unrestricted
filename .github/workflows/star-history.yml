name: Star History

on:
  schedule:
    - cron: '0 */6 * * *'
  watch:
    types: [started]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate Star History
        uses: narayann7/star-history-action@v1
        with:
          repos: ${{ github.repository }}
          type: Date
          themes: light,dark
          width: 800
          output-dir: assets/star-history
          update-readme: false
          commit: false

      - name: Update README
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          block = """<picture>
            <source media="(prefers-color-scheme: dark)" srcset="assets/star-history/star-history-dark.svg" />
            <source media="(prefers-color-scheme: light)" srcset="assets/star-history/star-history-light.svg" />
            <img alt="Star History Chart" src="assets/star-history/star-history-light.svg" />
          </picture>"""

          for filename in ("README.md",):
              path = Path(filename)
              content = path.read_text(encoding="utf-8")

              start = "<!-- star-history:start -->"
              end = "<!-- star-history:end -->"

              if start not in content or end not in content:
                  raise RuntimeError(f"Missing markers in {filename}")

              before, remainder = content.split(start, 1)
              _, after = remainder.split(end, 1)

              updated = before + start + "\n" + block + "\n" + end + after
              path.write_text(updated, encoding="utf-8")

              print(f"Updated {filename}")
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/star-history README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "docs: update star history"
          git push