[project]
name = "easyjailbreak-mcp"
version = "2.6.2"
description = "MCP server exposing EasyJailbreak attackers to the chat4code-unrestricted lab"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.0",
  "openai>=1.0",
  "uvicorn>=0.30",
  "starlette>=0.37",
]

[project.optional-dependencies]
datasets = ["datasets>=2.16"]
easyjailbreak = []  # EasyJailbreak 本身通过 EASYJAILBREAK_PATH 引用源码目录

[project.scripts]
easyjailbreak-mcp = "easyjailbreak_mcp.server:main"

[tool.setuptools]
packages = ["easyjailbreak_mcp"]
